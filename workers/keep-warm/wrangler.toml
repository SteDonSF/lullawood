name = "lullawood-keep-warm"
main = "index.js"
compatibility_date = "2026-08-11"

# Cron-only Worker — no public fetch surface (matches the other cron workers).
workers_dev = false
preview_urls = false

# Every 5 minutes, 24/7 — keeps the isolate + Neon HTTP connection warm so the
# login/session path stays sub-second instead of cold-starting at 15-20s.
[triggers]
crons = ["*/5 * * * *"]
